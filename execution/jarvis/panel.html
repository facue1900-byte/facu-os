<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #010409; --panel: rgba(8, 20, 34, .62); --panel2: rgba(12, 30, 50, .5);
    --hair: rgba(120, 210, 255, .14); --hair2: rgba(120, 210, 255, .32);
    --c: #5fe3ff; --c2: #b8f3ff; --blue: #3d7bff; --amber: #ffb547; --red: #ff4f64; --green: #3df0a6;
    --txt: #e2f6ff; --dim: #7c98ab; --faint: #42596b;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Space Grotesk", -apple-system, "Helvetica Neue", sans-serif;
    --glow: 0 0 24px rgba(95, 227, 255, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(95, 227, 255, .3); }

  /* ---------- fondo ---------- */
  #fondo { position: fixed; inset: 0; z-index: 0; }
  .vineta { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 42%, rgba(30, 90, 160, .16), transparent 70%),
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .75) 100%); }
  .barrido { position: fixed; left: 0; right: 0; height: 160px; z-index: 1; pointer-events: none; top: -160px;
    background: linear-gradient(180deg, transparent, rgba(95, 227, 255, .035), transparent); animation: barrer 9s linear infinite; }
  @keyframes barrer { to { transform: translateY(calc(100vh + 160px)); } }

  /* ---------- layout ---------- */
  .app { position: relative; z-index: 2; height: 100%; display: grid; gap: 18px; padding: 18px 24px 18px;
    grid-template-columns: minmax(300px, 360px) 1fr minmax(320px, 380px); grid-template-rows: auto 1fr auto; }
  .app > header { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 46px;
    border-bottom: 1px solid var(--hair); padding-bottom: 12px; }
  .marca { display: flex; align-items: baseline; gap: 14px; }
  .marca b { font: 600 15px var(--mono); letter-spacing: .55em; color: var(--c); text-shadow: 0 0 18px rgba(95, 227, 255, .5); }
  .marca span { font: 11px var(--mono); color: var(--faint); letter-spacing: .14em; text-transform: uppercase; }
  .pildora { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border: 1px solid var(--hair2); border-radius: 999px;
    font: 500 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; background: rgba(5, 16, 28, .7); }
  .pildora i { width: 8px; height: 8px; border-radius: 50%; background: var(--col, var(--green)); box-shadow: 0 0 10px var(--col, var(--green)); }
  .pildora.vivo i { animation: latir 1s ease-in-out infinite; }
  @keyframes latir { 50% { opacity: .35; transform: scale(.7); } }
  #cronometro { color: var(--dim); letter-spacing: .1em; }
  .derecha { display: flex; justify-content: flex-end; align-items: center; gap: 18px; }
  .chip { font: 10px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; padding: 5px 9px; border: 1px solid var(--hair); border-radius: 3px; white-space: nowrap; }
  .chip b { color: var(--c2); font-weight: 500; }
  .chip.on b { color: var(--green); } .chip.off b { color: var(--amber); }
  .chip.boton { background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip.boton:hover { border-color: var(--c2); }
  .chip .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--hair); display: none; }
  .chip.on .punto { display: inline-block; background: var(--green); animation: latido 1.6s ease-in-out infinite; }
  .chip.on.pausa .punto { background: var(--dim); animation: none; }
  @keyframes latido { 50% { opacity: .25; } }
  .reloj { text-align: right; line-height: 1.1; }
  .reloj b { display: block; font: 500 22px var(--mono); letter-spacing: .06em; color: var(--txt); }
  .reloj span { font: 10px var(--mono); color: var(--dim); letter-spacing: .2em; text-transform: uppercase; }

  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .col::-webkit-scrollbar { display: none; }

  /* ---------- tarjetas ---------- */
  .card { position: relative; background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--hair);
    border-radius: 10px; padding: 16px 18px 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 20px 50px rgba(0, 0, 0, .35); overflow: hidden; flex: none; }
  .card::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .55; }
  .card h2 { margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center;
    font: 500 10.5px var(--mono); letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
  .card h2 em { font-style: normal; color: var(--c); margin-right: 10px; }
  .card h2 small { font-size: 9.5px; letter-spacing: .14em; color: var(--faint); }
  .hero { font: 600 34px var(--mono); letter-spacing: -.02em; color: var(--txt); font-variant-numeric: tabular-nums; line-height: 1.05; }
  .hero.amber { color: var(--amber); text-shadow: 0 0 22px rgba(255, 181, 71, .25); }
  .sub { font: 11px var(--sans); color: var(--dim); margin: 6px 0 14px; }
  .grilla { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hair); }
  .grilla div { padding: 10px 0 2px; min-width: 0; }
  .grilla div + div { padding-left: 12px; border-left: 1px solid var(--hair); }
  .grilla b { display: block; font: 600 16px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grilla b.amber { color: var(--amber); } .grilla b.red { color: var(--red); } .grilla b.green { color: var(--green); }
  .grilla span { font: 9.5px var(--mono); color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .etiq { font: 10px var(--mono); padding: 3px 7px; border-radius: 3px; background: rgba(255, 181, 71, .08); color: var(--amber); border: 1px solid rgba(255, 181, 71, .25); }
  .barra { height: 4px; border-radius: 2px; background: rgba(120, 210, 255, .1); overflow: hidden; margin: 2px 0 6px; }
  .barra i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--c)); box-shadow: 0 0 10px rgba(95, 227, 255, .5);
    width: 0; transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
  .barra.amber i { background: linear-gradient(90deg, #ff8a3d, var(--amber)); box-shadow: 0 0 10px rgba(255, 181, 71, .45); }
  .fila { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--dim); }
  .fila b { color: var(--txt); font-weight: 500; }
  .deudor { padding: 8px 0 2px; }
  .deudor .fila span { color: var(--txt); font-family: var(--sans); font-size: 13px; }
  .deudor small { font: 9px var(--mono); color: var(--faint); letter-spacing: .12em; margin-left: 8px; }
  .sinDato { color: var(--red); font: 11px var(--mono); }

  /* ---------- operaciones ---------- */
  .tarea { padding: 10px 0; border-top: 1px solid var(--hair); }
  .tarea:first-child { border-top: 0; padding-top: 2px; }
  .tarea .tit { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .tarea .tit i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--col); box-shadow: 0 0 9px var(--col); }
  .tarea.corriendo .tit i { animation: latir 1s infinite; }
  .tarea .meta { font: 10px var(--mono); color: var(--dim); margin: 3px 0 7px 16px; }
  .tarea .meta.paso { color: var(--amber); margin-top: -4px; }
  .tarea .acc { display: flex; gap: 6px; margin-left: 16px; flex-wrap: wrap; }
  .vacio { font: 11px var(--mono); color: var(--faint); padding: 2px 0 6px; line-height: 1.5; }
  .bandeja { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
  .bandeja div { text-align: center; }
  .bandeja b { display: block; font: 600 16px var(--mono); }
  .bandeja span { font: 9px var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }

  /* ---------- centro ---------- */
  .centro { display: grid; grid-template-rows: minmax(250px, 1.1fr) auto minmax(150px, 1fr); min-height: 0; gap: 4px; }
  .reactor { position: relative; min-height: 0; }
  #nucleo { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .estadoTxt { text-align: center; font: 500 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--c); min-height: 18px; }
  .feed { min-height: 0; overflow-y: auto; padding: 14px 6% 4px; -webkit-mask-image: linear-gradient(transparent, #000 12%); mask-image: linear-gradient(transparent, #000 12%);
    scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
  .msg { margin: 0 0 14px; max-width: 92%; font-size: 15px; line-height: 1.55; white-space: pre-wrap; animation: entrar .4s ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  .msg.facu { margin-left: auto; text-align: right; color: var(--dim); font-size: 13.5px; }
  .msg.facu::before { content: "VOS"; display: block; font: 9.5px var(--mono); letter-spacing: .3em; color: var(--faint); margin-bottom: 3px; }
  .msg.jarvis { border-left: 2px solid var(--c); padding-left: 14px; color: var(--txt); }
  .msg.jarvis::before { content: "JARVIS"; display: block; font: 9.5px var(--mono); letter-spacing: .3em; color: var(--c); margin-bottom: 3px; }
  .msg.jarvis.avance { color: var(--dim); font-size: 13.5px; margin-bottom: 8px; }
  .msg.jarvis.avance::before { content: "JARVIS · BUSCANDO"; }
  .msg.jarvis.ultimo { text-shadow: 0 0 20px rgba(95, 227, 255, .12); }

  /* ---------- barra de comando ---------- */
  .app > footer { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  .comando { flex: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px; border: 1px solid var(--hair2); border-radius: 10px;
    background: rgba(4, 14, 26, .82); box-shadow: var(--glow); min-width: 0; }
  .comando:focus-within { border-color: var(--c); box-shadow: 0 0 0 3px rgba(95, 227, 255, .12), var(--glow); }
  .comando .prompt { font: 600 16px var(--mono); color: var(--c); }
  #texto { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--txt); font: 15px var(--sans); }
  #texto::placeholder { color: var(--faint); }
  .tecla { font: 10px var(--mono); color: var(--dim); border: 1px solid var(--hair2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  button { font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; height: 34px; padding: 0 14px; border-radius: 7px;
    border: 1px solid var(--hair2); background: rgba(95, 227, 255, .05); color: var(--c2); cursor: pointer; transition: all .15s; white-space: nowrap; }
  button:hover { border-color: var(--c); background: rgba(95, 227, 255, .12); color: #fff; }
  button:disabled { opacity: .4; cursor: progress; }
  button.mini { height: 26px; padding: 0 9px; font-size: 9.5px; letter-spacing: .12em; }
  button.ok { border-color: rgba(61, 240, 166, .5); color: var(--green); background: rgba(61, 240, 166, .07); }
  button.mal { border-color: rgba(255, 79, 100, .45); color: var(--red); background: rgba(255, 79, 100, .06); }
  #mic { width: 52px; height: 52px; padding: 0; border-radius: 10px; display: grid; place-items: center; flex: none; }
  #mic.rec { border-color: var(--red); color: var(--red); background: rgba(255, 79, 100, .14); box-shadow: 0 0 22px rgba(255, 79, 100, .35); }
  .grupo { display: flex; gap: 8px; }
  .gen { font: 10px var(--mono); color: var(--faint); letter-spacing: .1em; white-space: nowrap; }

  /* ---------- plan ---------- */
  #velo { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(1, 4, 9, .6); backdrop-filter: blur(6px); }
  #velo.ver { display: grid; }
  .plan { width: min(760px, 92vw); max-height: 82vh; display: flex; flex-direction: column; border: 1px solid rgba(255, 181, 71, .5); border-radius: 12px;
    background: linear-gradient(170deg, rgba(40, 28, 6, .92), rgba(10, 10, 14, .95)); box-shadow: 0 0 60px rgba(255, 181, 71, .14), 0 30px 80px rgba(0, 0, 0, .6); }
  .plan .cab { display: flex; justify-content: space-between; padding: 18px 22px 12px; border-bottom: 1px solid rgba(255, 181, 71, .2); }
  .plan .cab b { font: 600 11px var(--mono); letter-spacing: .3em; color: var(--amber); }
  .plan .cab span { font: 10px var(--mono); color: var(--dim); letter-spacing: .12em; }
  .plan pre { flex: 1; overflow-y: auto; margin: 0; padding: 16px 22px; white-space: pre-wrap; font: 12.5px/1.6 var(--mono); color: var(--txt); }
  .plan .pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 22px; border-top: 1px solid rgba(255, 181, 71, .2); }
  .plan .pie span { font: 10.5px var(--mono); color: var(--dim); }

  /* ---------- despertar / aviso ---------- */
  #despertar { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(circle at 50% 45%, rgba(10, 40, 70, .5), #010409 62%); }
  #despertar div { text-align: center; margin-top: 52vh; }
  #despertar b { display: block; font: 600 13px var(--mono); letter-spacing: .7em; color: var(--c); text-shadow: 0 0 20px rgba(95, 227, 255, .6); }
  #despertar span { display: block; margin-top: 14px; font: 11px var(--mono); letter-spacing: .25em; color: var(--dim); text-transform: uppercase; animation: latir 2.4s infinite; }
  #aviso { position: fixed; right: 24px; bottom: 90px; z-index: 25; max-width: 380px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--c);
    background: rgba(5, 20, 34, .95); box-shadow: 0 0 40px rgba(95, 227, 255, .2); font-size: 13px; line-height: 1.45; display: none; }
  #aviso b { display: block; font: 600 10px var(--mono); letter-spacing: .25em; color: var(--c); margin-bottom: 6px; }

  @media (max-width: 1100px) {
    html, body { overflow: auto; height: auto; }
    .app { display: flex; flex-direction: column; height: auto; }
    .app > header { order: -3; } .centro { order: -2; height: 80vh; }
    .derecha .chip, .tecla { display: none; }
    .app > footer { flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  }
</style>
</head>
<body>
<canvas id="fondo"></canvas><div class="vineta"></div><div class="barrido"></div>

<div id="despertar"><div><b>J · A · R · V · I · S</b><span>Tocá la pantalla o apretá una tecla</span></div></div>

<div class="app">
  <header>
    <div class="marca"><b>JARVIS</b><span>facu-os · claude code</span></div>
    <div class="pildora" id="pildora"><i></i><span id="estadoPil">en espera</span><span id="cronometro"></span></div>
    <div class="derecha">
      <span class="chip" id="chipCambios">cambios <b>—</b></span>
      <button class="chip boton" id="chipOido" title="Prender/apagar la palabra «Hey Jarvis»">hey jarvis <b>off</b><i class="punto"></i></button>
      <span class="chip">voz <b id="chipVoz">—</b></span>
      <div class="reloj"><b id="hora">--:--</b><span id="fecha"></span></div>
    </div>
  </header>

  <section class="col" id="izq"></section>

  <section class="centro">
    <div class="reactor"><canvas id="nucleo" title="Mantené apretado para hablar"></canvas></div>
    <div class="estadoTxt" id="estadoTxt"></div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="col" id="der">
    <div class="card" id="ops"><h2><span><em>04</em>Operaciones</span><small id="opsResumen"></small></h2>
      <div id="tareas"></div><div class="bandeja" id="bandeja"></div></div>
  </section>

  <footer>
    <button id="mic" title="Mantené apretado para hablar (o la barra espaciadora)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div class="comando"><span class="prompt">›</span>
      <input id="texto" placeholder="Dictale con Typeless o escribile…" autocomplete="off" spellcheck="false">
      <span class="tecla">TYPELESS dictar</span><span class="tecla">ENTER enviar</span></div>
    <div class="grupo">
      <button id="btnTerminal" title="Abrir esta conversación en la Terminal">Terminal</button>
      <button id="btnAnti" title="Abrir Antigravity con esta conversación">Antigravity</button>
      <button id="actualizar" title="Recalcula los números y el brief (~1 min)">Actualizar</button>
      <button id="nuevo" title="Arranca una conversación de cero">Nueva</button>
    </div>
    <span class="gen" id="generado"></span>
  </footer>
</div>

<div id="velo"><div class="plan">
  <div class="cab"><b>PLAN PARA APROBAR · SALE AL MUNDO</b><span id="planModo"></span></div>
  <pre id="planTexto"></pre>
  <div class="pie"><span>Lo ejecuta otra sesión que sólo ve este plan.</span>
    <div class="grupo"><button class="mal" id="planNo">Descartar</button><button class="ok" id="planSi">Aprobar y ejecutar</button></div></div>
</div></div>
<div id="aviso"></div>

<script>
const TOKEN = "{{TOKEN}}";
const H = { "X-Jarvis-Token": TOKEN };
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let despierto = false, ocupado = false, modo = "espera", planId = null, desde = 0, firmaConv = "", hayConv = false;
const tareasAvisadas = new Set();

// ============ reloj, estado ============
function reloj() {
  const d = new Date();
  $("hora").textContent = d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  $("fecha").textContent = d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  if (desde) { const s = Math.floor((Date.now() - desde) / 1000); $("cronometro").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
}
setInterval(reloj, 1000); reloj();
const MODOS = {
  espera: ["en espera", "var(--dim)"], linea: ["en línea", "var(--green)"], escuchando: ["escuchando", "var(--red)"],
  pensando: ["trabajando", "var(--amber)"], hablando: ["hablando", "var(--c)"],
};
function estado(m, detalle) {
  modo = m; const [t, c] = MODOS[m];
  $("estadoPil").textContent = t; $("pildora").style.setProperty("--col", c);
  $("pildora").classList.toggle("vivo", m === "pensando" || m === "escuchando");
  if (m === "pensando") { if (!desde) desde = Date.now(); } else { desde = 0; $("cronometro").textContent = ""; }
  $("estadoTxt").textContent = detalle || "";
  $("mic").classList.toggle("rec", m === "escuchando");
}

// ============ fondo: grilla de puntos ============
const fc = $("fondo"), fx = fc.getContext("2d");
function fondo() {
  const r = devicePixelRatio || 1; fc.width = innerWidth * r; fc.height = innerHeight * r; fx.setTransform(r, 0, 0, r, 0, 0);
  fx.fillStyle = "rgba(120,210,255,.09)";
  for (let x = 0; x < innerWidth; x += 28) for (let y = 0; y < innerHeight; y += 28) fx.fillRect(x, y, 1, 1);
}

// ============ núcleo: esfera de partículas 3D ============
const cv = $("nucleo"), cx = cv.getContext("2d");
let W = 0, Hh = 0;
function medir() { const b = cv.getBoundingClientRect(), r = devicePixelRatio || 1; W = b.width; Hh = b.height; cv.width = W * r; cv.height = Hh * r; cx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener("resize", () => { fondo(); medir(); }); fondo(); medir();
const N = 1100, PUNTOS = [];
for (let i = 0; i < N; i++) { const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  PUNTOS.push([Math.cos(th) * rad, y, Math.sin(th) * rad, Math.random() * 6.28]); }
let ctxAudio = null, analizador = null, nivel = 0, buf = null, rot = 0, vel = .003;
const COLOR = { espera: [95, 160, 200], linea: [95, 227, 255], escuchando: [255, 90, 120], pensando: [255, 181, 71], hablando: [95, 227, 255] };
let colAct = [95, 160, 200];
function dibujar(t) {
  let amp = 0;
  if (analizador) { if (!buf || buf.length !== analizador.fftSize) buf = new Uint8Array(analizador.fftSize);
    analizador.getByteTimeDomainData(buf); let s = 0; for (const v of buf) { const d = (v - 128) / 128; s += d * d; } amp = Math.min(1, Math.sqrt(s / buf.length) * 4.5); }
  const objetivo = modo === "pensando" ? .3 + .12 * Math.sin(t / 300) : modo === "espera" ? .05 : amp;
  nivel += (objetivo - nivel) * .15;

}
$("texto").addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === " " && !$("texto").value && despierto) { e.preventDefault(); empezarAGrabar().catch(errorMic); return; }  // vacío: espacio = hablar
  if (!e.metaKey && !e.ctrlKey) { ultimaTecla = performance.now(); if (!dictando) clearTimeout(autoEnvio); }
  if (e.key === "Enter") mandarTexto();
});
$("texto").addEventListener("keyup", e => { e.stopPropagation(); if (e.key === " " && grabador) cortar(); });
$("texto").addEventListener("beforeinput", e => {
  const pegado = e.inputType === "insertFromPaste" || e.inputType === "insertReplacementText" || performance.now() - ultimaTecla > 300;
  if (pegado && ($("texto").value.trim() === "" || dictando)) dictando = true;
});
$("texto").addEventListener("input", () => {
  if (!dictando) return;
  clearTimeout(autoEnvio); estado(modo === "pensando" ? "pensando" : "escuchando", "dictado recibido…");
  autoEnvio = setTimeout(mandarTexto, 1300);
});
// El campo vuelve a tener el foco solo: así el atajo de Typeless siempre escribe acá.
setInterval(() => { if (despierto && document.activeElement !== $("texto") && !$("velo").classList.contains("ver") && document.hasFocus()) $("texto").focus(); }, 1500);

let grabador = null, pedazos = [], quiereGrabar = false, abriendo = false, micFuente = null;
async function empezarAGrabar(manosLibres = false) {
  if (ocupado && despierto) { estado("pensando", "todavía estoy con lo anterior: esperá que termine"); return; }
  if (grabador || abriendo || ocupado || !despierto) return;
  quiereGrabar = true; abriendo = true;
  if (reproduciendo) reproduciendo.pause();
  estado("escuchando", "abriendo el micrófono…");
  let s; try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); } finally { abriendo = false; }
  if (!quiereGrabar) { s.getTracks().forEach(t => t.stop()); estado("linea", "soltaste antes de tiempo: mantené apretado y hablá cuando diga «te escucho»"); return; }
  micFuente = ctxAudio.createMediaStreamSource(s); analizador = ctxAudio.createAnalyser(); analizador.fftSize = 1024; micFuente.connect(analizador);
  pedazos = []; grabador = new MediaRecorder(s);
  grabador.ondataavailable = e => pedazos.push(e.data);
  grabador.onstop = () => { s.getTracks().forEach(t => t.stop()); if (micFuente) micFuente.disconnect(); analizador = null;
    const b = new Blob(pedazos, { type: grabador.mimeType }); grabador = null;
    if (b.size > 2000 && huboVoz) enviar(b, b.type || "audio/webm"); else estado("linea", manosLibres ? "no te escuché nada" : "muy corto: mantené apretado mientras hablás"); };
  huboVoz = !manosLibres;
  grabador.start(); estado("escuchando", manosLibres ? "te escucho… (corto cuando te callás)" : "te escucho…");
  if (manosLibres) cortarAlCallarse();
}
function cortar() { quiereGrabar = false; if (grabador && grabador.state === "recording") grabador.stop(); }
function errorMic(err) {
  estado("linea");
  $("feed").append(el("div", "msg jarvis", err && err.name === "NotAllowedError"
    ? "⚠️ No tengo permiso para el micrófono. Tocá el candado de arriba → Micrófono → Permitir. Si sigue: Ajustes del Sistema → Privacidad → Micrófono → Google Chrome."
    : "⚠️ micrófono: " + (err && err.message)));
}
document.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && despierto) { e.preventDefault(); empezarAGrabar().catch(errorMic); } });
document.addEventListener("keyup", e => { if (e.code === "Space" && despierto) { e.preventDefault(); cortar(); } });
for (const n of [cv, $("mic")]) { n.addEventListener("pointerdown", () => empezarAGrabar().catch(errorMic)); n.addEventListener("pointerup", cortar); n.addEventListener("pointerleave", cortar); }

// ============ «Hey Jarvis» ============
// El micrófono queda abierto SOLO con el interruptor prendido. El audio va al servidor de la Mac
// (127.0.0.1) en pedazos de ¼ s y ahí openWakeWord busca la palabra: nada sale de la compu.
// No se manda mientras Jarvis habla, piensa o graba: así no se despierta con su propia voz.
let huboVoz = false;
function cortarAlCallarse() {
  // Corta 1,3 s después de que dejaste de hablar; si en 6 s no dijiste nada, corta igual. Tope 25 s.
  const t0 = performance.now(), datos = new Uint8Array(512); let ultimaVoz = 0;
  const mirar = setInterval(() => {
    if (!grabador) return clearInterval(mirar);
    const ahora = performance.now();
    if (analizador) { analizador.getByteTimeDomainData(datos); let e = 0; for (const v of datos) e += (v - 128) ** 2;
      if (Math.sqrt(e / datos.length) > 6) { ultimaVoz = ahora; huboVoz = true; } }
    if ((ultimaVoz && ahora - ultimaVoz > 1300) || (!ultimaVoz && ahora - t0 > 6000) || ahora - t0 > 25000) { clearInterval(mirar); cortar(); }
  }, 100);
}
let oidoTocado = 0, oidoOn = false, oidoStream = null, oidoNodo = null, oidoFuente = null, oidoBuf = [], oidoLargo = 0, oidoMandando = false, oidoNuevo = true;
function oidoLibre() { return despierto && modo === "linea" && !ocupado && !grabador && !abriendo && !(reproduciendo && !reproduciendo.paused) && !$("velo").classList.contains("ver"); }
function ponerOido(on, guardar = true) {
  oidoOn = on;
  $("chipOido").className = "chip boton " + (on ? "on" : "off"); $("chipOido").querySelector("b").textContent = on ? "on" : "off";
  if (guardar) oidoTocado = Date.now();
  if (guardar) fetch("/api/escucha", { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ on }) }).catch(() => {});
  if (on && despierto) abrirOido().catch(e => { ponerOido(false); errorMic(e); }); else cerrarOido();
}
let oidoAbriendo = null;
function abrirOido() {   // una sola apertura a la vez: el arranque y el interruptor pueden pedirla juntos
  if (oidoStream || !ctxAudio) return Promise.resolve();
  return oidoAbriendo || (oidoAbriendo = _abrirOido().finally(() => { oidoAbriendo = null; }));
}
async function _abrirOido() {
  // Sin cancelación de eco ni supresión de ruido: en la Mac activan el procesamiento de voz del sistema y,
  // si otra app lo está usando, Chrome entrega SILENCIO (12/11/2026: volumen 0 durante minutos). Jarvis
  // igual deja de escuchar mientras habla, así que el eco no hace falta.
  const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
  if (!oidoOn) { s.getTracks().forEach(t => t.stop()); return; }
  oidoStream = s; oidoMudo = 0;
  s.getAudioTracks().forEach(t => { t.onended = () => reabrirOido("se desconectó el micrófono"); });
  oidoFuente = ctxAudio.createMediaStreamSource(oidoStream);
  oidoNodo = ctxAudio.createScriptProcessor(4096, 1, 1);
  const paso = ctxAudio.sampleRate / 16000;
  oidoNodo.onaudioprocess = ev => {
    const libre = oidoLibre(); $("chipOido").classList.toggle("pausa", !libre);
    if (!libre) { oidoBuf = []; oidoLargo = 0; oidoNuevo = true; return; }
    const x = ev.inputBuffer.getChannelData(0), n = Math.floor(x.length / paso), out = new Int16Array(n);
    // Micrófono mudo (todo cero exacto ~3 s): se reabre solo; si sigue mudo, se avisa en el botón.
    let pico = 0; for (let i = 0; i < x.length; i += 8) pico = Math.max(pico, Math.abs(x[i]));
    if (pico === 0) { oidoMudo += x.length / ctxAudio.sampleRate; if (oidoMudo > 3) { reabrirOido("el micrófono llegaba mudo"); return; } }
    else { oidoMudo = 0; if (oidoReintentos) { oidoReintentos = 0; $("chipOido").querySelector("b").textContent = "on"; } }
    for (let i = 0; i < n; i++) { let a = 0, k = 0; for (let j = Math.floor(i * paso); j < Math.floor((i + 1) * paso); j++) { a += x[j]; k++; }
      out[i] = Math.max(-32768, Math.min(32767, (a / k) * 32767)); }
    oidoBuf.push(out); oidoLargo += n;
    if (oidoLargo >= 4000 && !oidoMandando) mandarOido();
  };
  oidoFuente.connect(oidoNodo); oidoNodo.connect(ctxAudio.destination);   // sin conectarlo, Chrome no lo corre (sale en silencio)
}
async function mandarOido() {
  const pcm = new Int16Array(oidoLargo); let o = 0; for (const b of oidoBuf) { pcm.set(b, o); o += b.length; }
  oidoBuf = []; oidoLargo = 0; oidoMandando = true;
  const nuevo = oidoNuevo; oidoNuevo = false;
  try {
    const r = await fetch("/api/oido" + (nuevo ? "?nuevo=1" : ""), { method: "POST", headers: { ...H, "Content-Type": "application/octet-stream" }, body: pcm.buffer });
    const d = await r.json();
    if (d.error) { avisar("HEY JARVIS", d.error); ponerOido(false, false); return; }
    if (d.detectado && oidoLibre()) { pitido(); empezarAGrabar(true).catch(errorMic); }
  } catch (e) { /* servidor reiniciando: el próximo pedazo reintenta */ }
  finally { oidoMandando = false; }
}
let oidoMudo = 0, oidoReintentos = 0;
function reabrirOido(motivo) {
  if (!oidoOn) return;
  cerrarOido(); oidoReintentos++;
  if (oidoReintentos >= 3) {
    $("chipOido").querySelector("b").textContent = "mic mudo";
    if (oidoReintentos === 3) avisar("HEY JARVIS", "El micrófono le llega mudo a Jarvis (" + motivo + "). Puede que otra app lo esté usando: cerrala o recargá la pantalla (Cmd+R).");
  }
  setTimeout(() => { if (oidoOn && !oidoStream) abrirOido().catch(e => { ponerOido(false); errorMic(e); }); }, Math.min(30000, 1000 * oidoReintentos));
}
function cerrarOido() {
  if (oidoNodo) { oidoNodo.onaudioprocess = null; oidoNodo.disconnect(); oidoNodo = null; }
  if (oidoFuente) { oidoFuente.disconnect(); oidoFuente = null; }
  if (oidoStream) { oidoStream.getTracks().forEach(t => t.stop()); oidoStream = null; }   // se apaga la luz naranja del micrófono
  oidoBuf = []; oidoLargo = 0; oidoNuevo = true;
}
function pitido() {
  const o = ctxAudio.createOscillator(), g = ctxAudio.createGain(); o.frequency.value = 880;
  g.gain.setValueAtTime(0.12, ctxAudio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.18);
  o.connect(g); g.connect(ctxAudio.destination); o.start(); o.stop(ctxAudio.currentTime + 0.2);
}
$("chipOido").onclick = () => ponerOido(!oidoOn);

// ============ plan ============
async function responderPlan(si) {
  if (!planId) return; $("planSi").disabled = $("planNo").disabled = true; $("velo").classList.remove("ver"); estado("pensando", si ? "ejecutando el plan…" : "");
  try {
    const r = await fetch("/api/plan", { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ id: planId, si }) });
    const d = await r.json(); if (d.error) throw new Error(d.error);
    firmaConv = ""; await sondear(); estado("linea"); await hablar(d.audio);
  } catch (e) { $("feed").append(el("div", "msg jarvis", "⚠️ " + e.message)); estado("linea"); }
  finally { $("planSi").disabled = $("planNo").disabled = false; }
}
$("planSi").onclick = () => responderPlan(true); $("planNo").onclick = () => responderPlan(false);

// ============ botones ============
async function abrir(destino, sesion) {
  const r = await fetch("/api/abrir", { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ destino, sesion }) });
  const d = await r.json(); avisar("SESIÓN", d.respuesta || d.error);
}
$("btnTerminal").onclick = () => abrir("terminal", "jarvis");
$("btnAnti").onclick = () => abrir("antigravity", "jarvis");
$("nuevo").onclick = async () => { await fetch("/api/nuevo", { method: "POST", headers: H }); firmaConv = ""; $("feed").innerHTML = ""; await sondear(); avisar("JARVIS", "Conversación nueva, jefe."); };
$("actualizar").onclick = async () => {
  $("actualizar").disabled = true; estado("pensando", "recalculando los números del día…");
  try { const r = await fetch("/api/actualizar", { method: "POST", headers: H }); const b = await r.json();
    if (b.error && !b.paneles) throw new Error(b.error); await cargarYPintar(); estado("linea");
    $("feed").append(el("div", "msg jarvis ultimo", b.texto)); $("feed").scrollTop = 1e9; await hablar(b.audio); }
  catch (e) { $("feed").append(el("div", "msg jarvis", "⚠️ " + e.message)); estado("linea"); }
  finally { $("actualizar").disabled = false; }
};

// ============ arranque ============
async function despertar() {
  if (despierto) return; despierto = true;   // bandera: después del remove() el overlay es null
  $("despertar").remove(); ctxAudio = new AudioContext(); estado("linea");
  setInterval(sondear, 3500);                // antes de cualquier await: si algo falla, el panel igual vive
  let b = {};
  try { b = await cargarYPintar(); } catch (e) { avisar("SIN CONEXIÓN", "No pude traer el brief: el servidor puede estar reiniciando. Reintento solo."); }
  await sondear();
  if (oidoOn) abrirOido().catch(e => { ponerOido(false); errorMic(e); });
  if (b && b.texto) { $("feed").append(el("div", "msg jarvis ultimo", b.texto)); $("feed").scrollTop = 1e9; }
  const viejo = !b.generado || (Date.now() - new Date(b.generado)) > 14 * 3600 * 1000;
  if (viejo) avisar("BRIEF VIEJO", "Este resumen no es de hoy: tocá «Actualizar».");
  await hablar(b.audio);
}
$("despertar").addEventListener("click", despertar, { once: true });
document.addEventListener("keydown", function k(e) { if (!despierto) { e.preventDefault(); document.removeEventListener("keydown", k); despertar(); } });
estado("espera"); cargarYPintar().catch(() => {}); sondear();
</script>
